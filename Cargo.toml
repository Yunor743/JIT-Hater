[workspace]
resolver = "2"
members = ["jit-hater", "jit-hater-common"]
default-members = ["jit-hater"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
repository = "https://github.com/JIT-Hater/jit-hater"
license = "Apache-2.0"
authors = ["JIT-Hater contributors"]

[workspace.dependencies]
jit-hater-common = { path = "jit-hater-common" }

anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
libc = "0.2"
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "chrono"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
procfs = { version = "0.17", default-features = false }
signal-hook = "0.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
